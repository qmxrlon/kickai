[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E701"]  # aligned one-line if/elif in feature code is intentional

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # load_dotenv() must run before app imports

[tool.pytest.ini_options]
testpaths = ["tests"]
