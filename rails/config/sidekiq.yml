:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>
:queues:
  - [critical, 3]
  - [default, 2]
  - [low, 1]

:schedule:
  fetch_matches:
    cron: "0 */6 * * *"       # Every 6 hours
    class: FetchMatchesJob
    queue: default
    description: "Fetch upcoming matches from Football-Data.org"

  generate_predictions:
    cron: "30 */6 * * *"      # 30 min after fetch_matches
    class: GeneratePredictionsJob
    queue: default
    description: "Generate AI predictions for upcoming matches without predictions"

  fetch_standings:
    cron: "0 2 * * *"         # Daily at 02:00
    class: FetchStandingsJob
    queue: low
    description: "Refresh league standings"
